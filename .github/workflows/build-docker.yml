name: Build TWRP (Docker)

on:
  workflow_dispatch:
    inputs:
      twrp_branch:
        description: 'TWRP manifest branch'
        required: true
        default: 'twrp-11'
        type: choice
        options:
          - twrp-11
          - twrp-12.1
      clean_build:
        description: 'Clean build (full sync)'
        required: false
        default: false
        type: boolean

env:
  DEVICE: x695c
  VENDOR: infinix
  MANIFEST_URL: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git

jobs:
  build:
    runs-on: ubuntu-latest
    
    container:
      image: ubuntu:22.04
      options: --privileged
    
    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4

      - name: Set up build environment
        run: |
          apt-get update
          apt-get install -y \
            bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git gnupg gperf \
            lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev liblz4-tool libncurses5-dev \
            libssl-dev libwxgtk3.0-gtk3-dev \
            libxml2-utils lzop pngcrush \
            rsync schedtool squashfs-tools xsltproc \
            zip zlib1g-dev python3 openjdk-11-jdk \
            sudo wget

      - name: Install repo
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Configure git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Initialize and sync source
        run: |
          mkdir -p ~/twrp && cd ~/twrp
          repo init -u ${{ env.MANIFEST_URL }} -b ${{ github.event.inputs.twrp_branch || 'twrp-11' }} --depth=1
          repo sync -j$(nproc --all) || repo sync -j$(nproc --all)

      - name: Setup device tree
        run: |
          cd ~/twrp
          mkdir -p device/${{ env.VENDOR }}/${{ env.DEVICE }}
          cp -r $GITHUB_WORKSPACE/* device/${{ env.VENDOR }}/${{ env.DEVICE }}/

      - name: Build TWRP
        run: |
          cd ~/twrp
          source build/envsetup.sh
          lunch omni_${{ env.DEVICE }}-eng
          mka bootimage -j$(nproc --all)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: twrp-${{ env.DEVICE }}-${{ github.run_number }}
          path: |
            ~/twrp/out/target/product/${{ env.DEVICE }}/boot.img
            ~/twrp/out/target/product/${{ env.DEVICE }}/recovery.img
          if-no-files-found: warn
          retention-days: 30
